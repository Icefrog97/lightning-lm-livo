common:
  filter_size_surf: 0.8                             # iVox 纯 LIO 当前 scan 降采样
  livo_filter_size_surf: 0.4                        # VoxelMap LIO / LIVO 当前 scan 降采样，对齐 FAST avia.yaml
  filter_size_map: 0.8                              # LIO 往 iVox 加地图点时的体素门限（不是 looping 的 map/filter_size_map）
  esti_plane_threshold: 0.1                         # 点面 ICP 残差阈值
  image_topics: [/camera/image_raw]                 # 多目时按 cam_id 顺序填写

  T_body_wrt_lio: [-1, 0, -0.1]
  E_body_wrt_lio: [-0.8611351114, -9.9666036744, -0.5294170198]  # yaw pitch roll，度
  
visual:
  enable: false                                      # true: VoxelMap LIVO；false: 现有 iVox LIO
  lru_capacity: 8000                              # 视觉 feat_map 体素个数 LRU；0=不淘汰
  max_points_per_voxel: 20                         # 每个 0.5m 视觉体素最多 VisualPoint，满了删最老的；0=不限制

# YOLO26 E2E (TensorRT) 动态物剔除：去畸变后、匹配前滤点云；需图像 topic + 相机内外参
dynamic_filter:
  enable: false
  # 路径请在 launch 里设 $(find lightning)/model/xxx（yaml 里 $(find) 不展开）；此处留空由 launch 覆盖
  model_path: ""                                    # launch 里设 $(find lightning)/model/best.engine（或 .onnx）
  imgsz: 640
  conf_thres: 0.4
  iou_thres: 0.45                                   # E2E 无 NMS，此项忽略
  num_classes: 3                                   # E2E 解码不依赖，保留兼容
  keep_class_ids: []                # COCO: person,bicycle,car,motorcycle,bus,truck
  dilate_px: 5
  max_range: 80.0
  publish_removed_cloud: true                       # 发布被 YOLO 框掉的雷达点
  removed_body_topic: /dynamic_filter/removed_body  # IMU/body 系，叠 /cloud_registered_body
  removed_world_topic: /dynamic_filter/removed      # world 系，叠 /cloud_registered
time_offset:
  img_time_offset: 0.1                             # HKU/CBD 系列 bag 与 FAST avia.yaml 一致

camera:
  num: 1                                            # 单目=1，多目按 image_topics 数量设置
  exposure_time_init: 0.0                           # FAST-LIVO2 img_capture_time = stamp + exposure
  # CBD_Building_02 / HKU 系列标定（非 Avia/Mid360 默认外参）
  Rcl: [-0.01394, -0.99986, 0.00946,
      -0.04416, -0.00883, -0.99899,
      0.99893, -0.01435, -0.04403]
  Pcl: [0.02809, 0.02225, -0.01274]

vio:
  grid_size: 5                                      # FAST: <=10 时由 grid_n_height 反算实际像素网格
  grid_n_height: 12                                 # 图像竖直方向分成几格（每格选一个视觉 patch）。grid_size<=10 时生效：格宽=图像高/本值，再反算列数。越大格越小、patch 越多、越耗时；当前 5<=10 走这条
  patch_size: 8
  patch_pyrimid_level: 4                              # FAST avia.yaml；层 3→0 对应尺度 x8/x4/x2/x1
  max_iterations: 5
  raycast_en: false                                 # 不启用 FAST-LIVO2 视觉射线采样
  normal_en: true
  exposure_estimate_en: true
  inv_expo_cov: 0.1                                 # FAST avia.yaml；IMU 预测只涨 P(inv_expo)，不改均值
  outlier_threshold: 1000
  img_point_cov: 100
  ncc_en: false
  ncc_threshold: 0.854

preprocess:
  lidar_type: 4                                     # 1 robosense, 2 Velodyne, 3 ouster, 4 Mid360 PointCloud2, 5 livox_ros_driver2/CustomMsg
  scan_line: 6
  scan_rate: 10                                     # only need to be set for velodyne, unit: Hz,
  blind: 1.0                                          # lidar 盲区
  point_filter_num: 5                               # lidar 跳点 step 注意不要用 4 的倍数！！！！！
  height_max: 1000                                  # lidar 直通滤波
  height_min: -100

imu_filter: 
  use_imu_filter: false
  imu: 1

# VoxelMap 雷达平面地图（use_voxel_map=true 或 visual.enable=true 时使用）
lio:
  use_voxel_map: true                               # true: FAST VoxelMap LIO（可关 VIO 单独验证）；false 且 visual 关: iVox
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.4
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]
  sigma_num: 3.0
  lru_capacity: 20000                              # LIO 根体素 LRU；0=不淘汰

mapping:
  omp_num: 2                                        # OMP 使用线程数
  acc_cov: 0.1                                      # imu 加速度噪声协方差
  gyr_cov: 0.1                                      # imu 角速度噪声协方差
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_T: [0.04165, 0.02326, -0.0284]       # T_imu_lidar
  extrinsic_R: [ 1, 0, 0,                           # R_imu_lidar
                0, 1, 0,
                0, 0, 1]
  use_aa: false                                     # 减少 lio 迭代次数减少耗时
  kf_dis_th: 1.0                                    # 关键帧距离阈值
  kf_angle_th: 10                                   # 关键帧角度阈值
publish:
  path_en: true                                     # 发布 path
  scan_publish_en: true                             # 发布 world 系雷达点云 /cloud_registered
  dense_publish_en: true                             # 与 FAST dense_map_en 一致：发去畸变全量，不要 0.4m 体素墙面 
  scan_bodyframe_pub_en: false                       # 发布 body 系下全量雷达点云 /cloud_registered_body
  rgb_img_en: true                                  # LIVO 调试图 /rgb_img：特征点 + YOLO 框（0.5 scale）
  rgb_cloud_en: true                                # LIVO RGB 点云：/cloud_registered_rgb
  blind_rgb_points: 0.0                             # RGB 点云近距离过滤阈值，和 FAST blind_rgb_points 语义一致
  pub_path_num: 40                                 # path 发布跳点 step

pcd_save:
  dense_pcd_save_en: true                           # mapping 保存全量地图；开视觉时存 RGB 到 global_dense_map.pcd
  enu_results: true                                 # 转化为enu系

fasterlio:
  ivox_grid_resolution: 0.8
  ivox_nearby_type: 18                              # ivox 最近邻搜索模式(0：中心, 6: 面邻, 18: 面+棱邻, 26: 面+棱+角邻)
  ivox_capacity: 50000                            # ivox 最大容量
  max_iteration: 6                                  # IEKF 最大迭代次数
  imu_reset_level: 1                                # 系统发散后的初始化逻辑 1: 静止初始化 2：动态初始化
  max_init_count: 30                                # imu 初始化所需帧数
  enable_icp_part: false                           # 是否添加点-点 ICP 部分
  plane_icp_weight: 600.0
  min_pts: 300
  proj_kfs: false
  degeneracy_threshold_ratio: 0.2                   # 退化检测比例阈值
  use_degeneracy: false                              # 退化检测是否启用

### localization ================================================================================================
lidar_loc:
  enable_icp_adjust: false                          # 初始化启用 Icp 精配准
  # filter_z_max: 30.0                                # 动态图层高度上限，单位 m
  # filter_z_min: -1.0                                # 动态图层高度下限，单位 m
  force_2d: false                                   # 强制定位 2d 位姿估计
  grid_search_angle_range: 60.0                    # 初始化点的搜索范围，正负 grid_search_angle_range
  grid_search_angle_step: 15                        # 初始化点搜索范围的离散数量
  lidar_loc_odom_th: 0.5                            # 激光两帧匹配结果与对应lidarodom结果差的阈值，超过则认为lidarodom异常
  init_with_fp: true                                # 通过功能点初始化定位
  init_with_recover: false                           # 通过断电点 recover.txt 初始化定位
  min_init_confidence: 1.9                          # 最低配准置信度阈值
  update_dynamic_cloud: false                       # 更新动态地图
  update_kf_dis: 1.0                                # 动态地图关键帧距离阈值
  update_lidar_loc_score: 1.3                       # 动态地图更新时激光定位匹配分值阈值
  loc_on_kf: true                                   # 仅关键帧加入后端定位
  try_self_extrap: false                            # 定位初值是否尝试自身内推
  add_recover_to_index: false                       # 启动程序时添加恢复点到功能点中
  ndt_omp_th: 4                                     # ndt omp 线程数
  use_3d_bbs: true                                  # 是否使用 3D BBS 模型  
  use_3dbbs_just_reset: false                       # 是否仅在系统发散时使用 3D BBS 模型  

system:
  enable_lidar_loc_skip: false                      # Lidar localization 跳帧
  enable_lidar_odom_skip: false                     # lio 跳帧
  lidar_loc_skip_num: 4                             # lidar localization 跳帧帧数
  lidar_odom_skip_num: 2                            # lio 跳帧帧数
  dense_map_name: "global_dense_map.pcd"            # mapping 保存的全量地图
  down_map_name: "global_down_map.pcd"              # mapping 保存的降采样地图
  global_loop_map_name: "global_loop_map"       # 用于定位的全局静态地图, 存放于 MAP/ 下, 默认 global_loop_map
  log_level: 0                                      # Log 打印等级 0: INFO, 1: WARNING, 2: ERROR, 3: FATAL

maps:
  dyn_cloud_policy: persistent                      # 动态地图保存模式
  load_dyn_cloud: false                             # 加载动态点云
  max_pts_dyn_chunk: 100000                         # 单片瓦片地图的最大点云数量
  save_dyn_when_quit: false                         # 退出时保存动态地图
